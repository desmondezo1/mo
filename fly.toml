# Fly.io: one small machine with a volume for each user's data (/data).
#   fly launch --no-deploy --copy-config   (first time; pick a name, keep this file)
#   fly volumes create mo_data --size 1
#   fly secrets set SUPABASE_URL=… SUPABASE_ANON_KEY=… SUPABASE_JWT_SECRET=… MUBIT_API_KEY=… ALLOWED_ORIGINS=chrome-extension://<id>
#   fly deploy
app = "mo-backend"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  SHOWME_DATA_DIR = "/data"
  MONTHLY_DECISION_CAP = "3000"
  DAILY_SPEND_CAP_USD = "25"
  RATE_PER_MINUTE = "120"

[[mounts]]
  source = "mo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
